name: Deploy marketing site (floorbeat.in)

# main -> floorbeat.in, staging -> stage-www.floorbeat.in, develop -> dev-www.floorbeat.in
on:
  push:
    branches: [main, staging, develop]
    paths:
      - 'marketing/**'
      - '.github/workflows/deploy-marketing.yml'
  pull_request:
    branches: [main]
    paths:
      - 'marketing/**'
      - '.github/workflows/deploy-marketing.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Test & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: marketing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: marketing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        if: github.event_name != 'pull_request' && contains(fromJSON('["refs/heads/main","refs/heads/staging","refs/heads/develop"]'), github.ref)
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: marketing
          command: deploy${{ github.ref_name == 'staging' && ' --env stage' || github.ref_name == 'develop' && ' --env dev' || '' }}
