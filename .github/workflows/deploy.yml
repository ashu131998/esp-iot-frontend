name: Deploy to Cloudflare Workers

on:
  push:
    # main -> app/ops (production), staging -> stage.floorbeat.in, develop -> dev.floorbeat.in
    branches: [main, staging, develop]
    paths-ignore:
      - 'marketing/**'
      - '.github/workflows/deploy-marketing.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'marketing/**'
      - '.github/workflows/deploy-marketing.yml'
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Pin the exact npm the lock file was generated with, so CI resolves
      # the dependency tree identically to local dev (see packageManager).
      - name: Pin npm
        run: npm install -g npm@11.12.1

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    name: Build & Deploy
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Pin the exact npm the lock file was generated with, so CI resolves
      # the dependency tree identically to local dev (see packageManager).
      - name: Pin npm
        run: npm install -g npm@11.12.1

      - name: Install dependencies
        run: npm ci

      - name: Build for Cloudflare
        run: npx opennextjs-cloudflare build
        env:
          NODE_ENV: production
          # NEXT_PUBLIC_ vars are inlined at build time
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Deploy customer dashboard Worker (env app)
        uses: cloudflare/wrangler-action@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env app

      # Push runtime secrets into both Workers after each deploy
      - name: Set Worker runtime secrets
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for env_flag in "" "--env app"; do
            echo "${{ secrets.JWT_ACCESS_SECRET }}" | npx wrangler secret put JWT_ACCESS_SECRET $env_flag
            echo "${{ secrets.API_INTERNAL_URL }}"  | npx wrangler secret put API_INTERNAL_URL $env_flag
          done

      # Stage / dev: same build, their own Worker (API_INTERNAL_URL is a plain
      # var in wrangler.jsonc). JWT_ACCESS_SECRET must match that backend's .env.
      - name: Deploy non-production Worker
        uses: cloudflare/wrangler-action@v3
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/develop')
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env ${{ github.ref_name == 'staging' && 'stage' || 'dev' }}

      - name: Set non-production Worker secret
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/develop')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ github.ref_name == 'staging' && secrets.STAGE_JWT_ACCESS_SECRET || secrets.DEV_JWT_ACCESS_SECRET }}
          ENV_NAME: ${{ github.ref_name == 'staging' && 'stage' || 'dev' }}
        run: printf '%s' "$JWT_SECRET" | npx wrangler secret put JWT_ACCESS_SECRET --env "$ENV_NAME"
